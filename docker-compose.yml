services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: socialshub-app
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - .:/var/www
      - ./docker/app/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
      - ./docker/app/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./docker/app/99-uploads.ini:/usr/local/etc/php/conf.d/99-uploads.ini:ro
      - ./docker/app/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    depends_on:
      - mysql
      - redis
    networks:
      - socialshub-net

  nginx:
    image: nginx:alpine
    container_name: socialshub-nginx
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - socialshub-net

  mysql:
    image: mysql:8.0
    container_name: socialshub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-socialshub}
      MYSQL_USER: ${DB_USERNAME:-socialshub}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "33066:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - socialshub-net

  redis:
    image: redis:7-alpine
    container_name: socialshub-redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    networks:
      - socialshub-net

volumes:
  mysql_data:
  redis_data:

networks:
  socialshub-net:
    driver: bridge
