version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: dropwave-app
    restart: unless-stopped
    volumes:
      - .:/var/www
      - ./docker/app/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      - mysql
      - redis
    networks:
      - dropwave-net

  nginx:
    image: nginx:alpine
    container_name: dropwave-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dropwave-net

  mysql:
    image: mysql:8.0
    container_name: dropwave-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-dropwave}
      MYSQL_USER: ${DB_USERNAME:-dropwave}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "33066:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dropwave-net

  redis:
    image: redis:7-alpine
    container_name: dropwave-redis
    restart: unless-stopped
    ports:
      - "63790:6379"
    volumes:
      - redis_data:/data
    networks:
      - dropwave-net

volumes:
  mysql_data:
  redis_data:

networks:
  dropwave-net:
    driver: bridge
