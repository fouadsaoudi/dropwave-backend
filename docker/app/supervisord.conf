[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
minfds=65535
minprocs=65535

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/php-fpm.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log

[program:reverb]
command=php /var/www/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/reverb.err.log
stdout_logfile=/var/log/supervisor/reverb.out.log

[program:queue-1]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --backoff=5 --timeout=60
autostart=true
autorestart=true
startsecs=0
startretries=20
stdout_logfile=/var/log/supervisor/queue-1.log
stderr_logfile=/var/log/supervisor/queue-1.err.log

[program:queue-2]
command=php /var/www/artisan queue:work --sleep=3 --tries=3 --backoff=5 --timeout=60
autostart=true
autorestart=true
startsecs=0
startretries=20
stdout_logfile=/var/log/supervisor/queue-2.log
stderr_logfile=/var/log/supervisor/queue-2.err.log

[program:scheduler]
command=bash -c "while true; do php /var/www/artisan schedule:run --no-interaction; sleep 60; done"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler.err.log
